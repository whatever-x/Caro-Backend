# 로컬 개발용 인프라(MySQL, Redis)만 정의한다.
# 앱은 호스트에서 `make run`으로 실행한다.
# 아래 자격증명은 로컬 전용 고정값이다.
# 호스트 포트가 겹치면 CARO_MYSQL_PORT / CARO_REDIS_PORT로 바꾸고, DB_URL / REDIS_PORT는 Infisical 개인 override로 맞춘다.
name: caro-local

services:
  mysql:
    image: mysql:8.4
    container_name: caro-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: carolocal
      MYSQL_USER: caro
      MYSQL_PASSWORD: caro
    ports:
      - "${CARO_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8.4
    container_name: caro-redis
    environment:
      REDIS_PASSWORD: caro
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${CARO_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  redis-data:
