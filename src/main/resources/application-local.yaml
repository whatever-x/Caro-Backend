spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/seed-dev
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}

app:
  jwt:
    secret: local-dev-secret-key-must-be-at-least-32-bytes-long-for-hs256
  oauth2:
    google:
      client-id: local-google-client-id
    apple:
      client-ids:
        - local-apple-client-id-1
        - local-apple-client-id-2

logging:
  level:
    com.whatever.caro: debug
    org.flywaydb: debug
    org.springframework.modulith: debug
    org.hibernate.sql: debug

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0
