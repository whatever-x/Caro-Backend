spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    clean-disabled: false
    locations: classpath:db/migration,classpath:db/seed
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD}

app:
  jwt:
    secret: local-dev-secret-key-must-be-at-least-32-bytes-long-for-hs256
  oauth2:
    google:
      client-id: local-google-client-id
    apple:
      client-ids:
        - local-apple-client-id-1
        - local-apple-client-id-2
  email:
    # 로컬은 Infisical 주입 키 사용. 미주입(테스트 등) 시 더미 키로 폴백 (prod 프로필엔 기본값 두지 말 것)
    encryption-key: ${EMAIL_ENCRYPTION_KEY:dGVzdC1lbmNyeXB0aW9uLWtleS0wMTIzNDU2Nzg5YWI=}
    blind-index-key: ${EMAIL_BLIND_INDEX_KEY:dGVzdC1ibGluZGluZGV4LWtleS0wMTIzNDU2Nzg5YWI=}

logging:
  level:
    com.whatever.caro: debug
    org.flywaydb: debug
    org.springframework.modulith: debug
    org.hibernate.sql: debug

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0
