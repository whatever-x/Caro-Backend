name: CI

on:
  pull_request:
  push:
    branches: [ develop, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  format-check:
    name: Code Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Show formatting guide on failure
        if: failure()
        run: |
          echo ""
          echo "========================================"
          echo "코드 포맷팅이 필요합니다!"
          echo "========================================"
          echo ""
          echo "로컬에서 아래 명령어를 실행하세요:"
          echo ""
          echo "  ./gradlew spotlessApply"
          echo ""
          echo "========================================"

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests with coverage
        run: ./gradlew test koverXmlReport koverVerify

      - name: Print coverage summary
        if: success()
        run: ./gradlew koverLog

      - name: Add coverage report to PR
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v2
        with:
          path: build/reports/kover/report.xml
          title: Code Coverage Report
          update-comment: true
          min-coverage-overall: 70
          min-coverage-changed-files: 85
          coverage-counter-type: LINE

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            build/reports/kover/html/
            build/reports/kover/report.xml
          retention-days: 30

      - name: Upload test failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

  docker-build-check:
    name: Docker build check
    needs: [ format-check, test ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type-gha,mode=max

  notify-main-failure:
    name: Notify Main Failure
    needs: [ format-check, test, docker-build-check ]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Get failed jobs
        id: failed-jobs
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            const failures = jobs.data.jobs
              .filter(j => j.conclusion === 'failure')
              .map(j => j.name === 'Code Format' ? '- 포맷팅 필요' : `- ${j.name} 실패`)
              .join('\n');
            core.setOutput('failures', failures || '- Unknown failure');

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_GIT_NOTIFY_CHANNEL_ID }}
            text: "main 브랜치 CI 실패"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: "Production 배포 차단"
              - type: section
                text:
                  type: mrkdwn
                  text: "<!channel> *main* 브랜치 CI 실패"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Author*\n@${{ github.actor }}"
                  - type: mrkdwn
                    text: "*실패 원인*\n${{ steps.failed-jobs.outputs.failures }}"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: "Workflow 확인"
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
