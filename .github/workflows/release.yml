name: Release

on:
  push:
    tags: [ 'v*' ]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/whatever-x/caro-backend
  SERVER_TS_IP: 100.122.155.55     # staging VM의 tailnet IP (사설, 접근은 ACL+SSH가 통제)

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tag & Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag commit
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop \
          || { echo "::error::태그 커밋이 히스토리에 없습니다"; exit 1; }

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test koverVerify

  build-push:
    name: Build & Push Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}          # 검증/로그용 semver 태그 (0.0.6-rc.6)
      image_tag: sha-${{ steps.vars.outputs.short_sha }}  # deploy가 실제로 pull하는 불변 태그 (sha-0495b1d)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYY-MM-DD'}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Compute build args
        id: vars
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Assert `metadata version == tag`
        run: |
          test "${{ steps.meta.outputs.version }}" = "${GITHUB_REF_NAME#v}" \
          || { echo "::error::metadata version과 태그가 불일치"; exit 1; }

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: env.BUILDKIT_STEP_LOG_MAX_SIZE=-1

      - name: Fail if image tag already exists
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.meta.outputs.version }} 태그가 이미 존재합니다"; exit 1;
          fi

      - name: Build & Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            RELEASE_VERSION=${{ steps.meta.outputs.version }}
            GIT_COMMIT=${{ steps.vars.outputs.short_sha }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha

  deploy:
    name: Deploy to staging
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy via SSH
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}   # sha-<short> 불변 태그로 배포
        run: |
          echo "== deploy: $IMAGE_TAG =="
          ssh -o StrictHostKeyChecking=accept-new \
              "deploy@$SERVER_TS_IP" \
              "~/caro/deploy.sh '$IMAGE_TAG'"
