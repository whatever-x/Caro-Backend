services:
  mysql:
    image: mysql:8.0
    container_name: caro-mysql
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: CARO
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - caro-mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: caro-redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - caro-redis-data:/data
      - ./docker/redis-entrypoint.sh:/entrypoint.sh
    entrypoint: ["sh", "/entrypoint.sh"]

volumes:
  caro-mysql-data:
  caro-redis-data:
